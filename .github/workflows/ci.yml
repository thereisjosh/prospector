name: ci

on:
  push:
    branches: [master, v2-engine]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Tests mock every model and Exa call; demo mode needs no keys.
      DEMO_MODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
