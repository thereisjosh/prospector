name: ci

on:
  push:
    branches: [master, v2-engine]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Tests mock every model and Exa call and set their own data dirs; no keys or
    # DEMO_MODE here — DEMO_MODE=1 would route /api/runs to the demo replay and
    # break the live-route tests (that is what turned the first CI run red).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
